<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Macro & Calorie Tracker</title>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #f4f4f5;
      --card-bg: #ffffff;
      --text: #18181b;
      --border: #e4e4e7;
      --muted: #71717a;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --cals-bg: #e0f2fe; --cals-txt: #0369a1;
      --protein-bg: #dcfce7; --protein-txt: #15803d;
      --carbs-bg: #fef08a; --carbs-txt: #a16207;
      --fats-bg: #ffedd5; --fats-txt: #c2410c;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 20px;
    }

    .container { max-width: 900px; margin: 0 auto; }
    h1 { text-align: center; margin-bottom: 20px; }

    nav {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 24px;
    }

    .nav-btn {
      padding: 10px 24px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--card-bg);
      color: var(--text);
      cursor: pointer;
      transition: all 0.2s;
    }

    .nav-btn.active {
      background-color: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    .view { display: none; }
    .view.active { display: block; }

    .card {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }

    .dashboard {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      margin-bottom: 20px;
    }

    .stat-box { padding: 16px; border-radius: 12px; text-align: center; }
    .stat-box h3 { margin: 0 0 6px 0; font-size: 1rem; }
    .stat-box p { margin: 0; font-size: 1.4rem; font-weight: bold; }

    .stat-cals { background: var(--cals-bg); color: var(--cals-txt); }
    .stat-protein { background: var(--protein-bg); color: var(--protein-txt); }
    .stat-carbs { background: var(--carbs-bg); color: var(--carbs-txt); }
    .stat-fats { background: var(--fats-bg); color: var(--fats-txt); }

    .controls-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 2fr;
      gap: 12px;
      align-items: center;
    }

    .form-group { display: flex; flex-direction: column; gap: 4px; }
    label { font-size: 0.85rem; font-weight: 600; color: var(--muted); }
    input, select {
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 1rem;
      background: #fff;
    }

    button.btn-primary {
      padding: 12px 20px;
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    button.btn-primary:hover { background-color: var(--primary-hover); }

    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { text-align: left; padding: 12px; border-bottom: 1px solid var(--border); }
    th { font-weight: 600; color: var(--muted); }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.85rem;
      text-transform: capitalize;
      background: var(--bg);
      font-weight: 600;
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--muted);
    }
    
    @media (max-width: 768px) {
      .controls-grid { grid-template-columns: 1fr; }
      nav { flex-direction: row; }
      .nav-btn { flex: 1; text-align: center; }
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Shared Macro & Calorie Tracker</h1>

  <nav>
    <button class="nav-btn active" id="btn-view-logs">View Food Log</button>
    <button class="nav-btn" id="btn-add-log">Log New Food</button>
  </nav>

  <!-- VIEW 1: VIEW LOGS -->
  <section id="view-display" class="view active">
    <div class="card">
      <div class="dashboard">
        <div class="stat-box stat-cals">
          <h3>Total Calories</h3>
          <p><span id="total-cals">0</span> kcal</p>
        </div>
        <div class="stat-box stat-protein">
          <h3>Protein</h3>
          <p><span id="total-protein">0</span>g</p>
        </div>
        <div class="stat-box stat-carbs">
          <h3>Carbs</h3>
          <p><span id="total-carbs">0</span>g</p>
        </div>
        <div class="stat-box stat-fats">
          <h3>Fats</h3>
          <p><span id="total-fats">0</span>g</p>
        </div>
      </div>

      <div class="controls-grid">
        <div class="form-group">
          <label for="filter-meal">Filter by Meal</label>
          <select id="filter-meal">
            <option value="all">All Meals</option>
            <option value="breakfast">Breakfast</option>
            <option value="lunch">Lunch</option>
            <option value="dinner">Dinner</option>
            <option value="snack">Snack</option>
          </select>
        </div>

        <div class="form-group">
          <label for="sort-by">Sort By</label>
          <select id="sort-by">
            <option value="added_at-desc">Newest First</option>
            <option value="calories-desc">Highest Calories</option>
            <option value="protein-desc">Highest Protein</option>
          </select>
        </div>

        <div class="form-group">
          <label for="search-input">Search Food Name</label>
          <input type="text" id="search-input" placeholder="e.g. Chicken, Oats...">
        </div>
      </div>
    </div>

    <div class="card">
      <div id="log-count" style="font-weight: 600; color: var(--muted); margin-bottom: 10px;">Showing 0 entries</div>
      <div style="overflow-x: auto;">
        <table>
          <thead>
            <tr>
              <th>Food</th>
              <th>Meal</th>
              <th>Cals</th>
              <th>Protein</th>
              <th>Carbs</th>
              <th>Fats</th>
              <th>Logged By</th>
            </tr>
          </thead>
          <tbody id="food-log-body">
            <!-- Dynamic rows inserted here -->
          </tbody>
        </table>
      </div>
      <div id="empty-state" class="empty-state" style="display: none;">
        No food items found matching your filters.
      </div>
    </div>
  </section>

  <!-- VIEW 2: ADD FOOD -->
  <section id="view-add" class="view">
    <div class="card">
      <h2 style="margin-bottom: 20px;">Log a Food Entry</h2>
      <form id="food-form" style="display: flex; flex-direction: column; gap: 16px;">
        
        <div class="form-group">
          <label for="user_name">Your Name *</label>
          <input type="text" id="user_name" required maxlength="50" placeholder="e.g. Bob">
        </div>

        <div class="form-group">
          <label for="food_name">Food Name *</label>
          <input type="text" id="food_name" required maxlength="100" placeholder="e.g. Grilled Chicken Breast">
        </div>

        <div class="form-group">
          <label for="meal">Meal Category *</label>
          <select id="meal" required>
            <option value="">Choose meal...</option>
            <option value="breakfast">Breakfast</option>
            <option value="lunch">Lunch</option>
            <option value="dinner">Dinner</option>
            <option value="snack">Snack</option>
          </select>
        </div>

        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px;">
          <div class="form-group">
            <label for="calories">Calories (kcal) *</label>
            <input type="number" id="calories" min="0" max="10000" required placeholder="350">
          </div>
          <div class="form-group">
            <label for="protein">Protein (g) *</label>
            <input type="number" id="protein" min="0" max="1000" required placeholder="30">
          </div>
          <div class="form-group">
            <label for="carbs">Carbs (g) *</label>
            <input type="number" id="carbs" min="0" max="1000" required placeholder="10">
          </div>
          <div class="form-group">
            <label for="fats">Fats (g) *</label>
            <input type="number" id="fats" min="0" max="1000" required placeholder="5">
          </div>
        </div>

        <button type="submit" class="btn-primary" style="margin-top: 10px;">Save Food Log</button>
      </form>
    </div>
  </section>
</div>

<script>
  // ==========================================
  // MUST REPLACE THESE WITH YOUR ACTUAL KEYS!
  // ==========================================
  const SUPABASE_URL = "YOUR_SUPABASE_URL";
  const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";
  const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // DOM Elements
  const btnViewLogs = document.getElementById('btn-view-logs');
  const btnAddLog = document.getElementById('btn-add-log');
  const viewDisplay = document.getElementById('view-display');
  const viewAdd = document.getElementById('view-add');

  const filterMeal = document.getElementById('filter-meal');
  const sortBy = document.getElementById('sort-by');
  const searchInput = document.getElementById('search-input');
  
  const foodLogBody = document.getElementById('food-log-body');
  const emptyState = document.getElementById('empty-state');
  const logCount = document.getElementById('log-count');

  // Navigation Logic
  btnViewLogs.addEventListener('click', () => {
    btnViewLogs.classList.add('active');
    btnAddLog.classList.remove('active');
    viewDisplay.classList.add('active');
    viewAdd.classList.remove('active');
    fetchLogs(); // Automatically fetch freshest data when switching to this view
  });

  btnAddLog.addEventListener('click', () => {
    btnAddLog.classList.add('active');
    btnViewLogs.classList.remove('active');
    viewAdd.classList.add('active');
    viewDisplay.classList.remove('active');
  });

  // Fetch data from database
  async function fetchLogs() {
    foodLogBody.innerHTML = '<tr><td colspan="7">Loading logs...</td></tr>';
    emptyState.style.display = 'none';

    const [sortCol, sortDir] = sortBy.value.split('-');

    let query = db
      .from('food_logs')
      .select('*')
      .order(sortCol, { ascending: sortDir === 'asc' })
      .limit(300);

    if (filterMeal.value !== 'all') {
      query = query.eq('meal', filterMeal.value);
    }

    if (searchInput.value.trim() !== '') {
      query = query.ilike('food_name', `%${searchInput.value.trim()}%`);
    }

    const { data, error } = await query;

    if (error) {
      console.error(error);
      foodLogBody.innerHTML = `<tr><td colspan="7" style="color:red;">Error connecting to database. Did you add your URL and Keys?</td></tr>`;
      return;
    }

    renderTable(data);
  }

  function renderTable(logs) {
    foodLogBody.innerHTML = '';
    
    let cals = 0, p = 0, c = 0, f = 0;
    logs.forEach(item => {
      cals += Number(item.calories || 0);
      p += Number(item.protein || 0);
      c += Number(item.carbs || 0);
      f += Number(item.fats || 0);
    });

    document.getElementById('total-cals').textContent = cals;
    document.getElementById('total-protein').textContent = p;
    document.getElementById('total-carbs').textContent = c;
    document.getElementById('total-fats').textContent = f;
    logCount.textContent = `Showing ${logs.length} logged items`;

    if (logs.length === 0) {
      emptyState.style.display = 'block';
      return;
    }

    emptyState.style.display = 'none';
    
    logs.forEach(item => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td><strong>${escapeHTML(item.food_name)}</strong></td>
        <td><span class="badge">${escapeHTML(item.meal)}</span></td>
        <td>${item.calories}</td>
        <td>${item.protein}g</td>
        <td>${item.carbs}g</td>
        <td>${item.fats}g</td>
        <td>${escapeHTML(item.user_name)}</td>
      `;
      foodLogBody.appendChild(tr);
    });
  }

  // Handle Form Submission
  document.getElementById('food-form').addEventListener('submit', async function(e) {
    e.preventDefault();

    const user_name = document.getElementById('user_name').value.trim();
    const food_name = document.getElementById('food_name').value.trim();
    const meal = document.getElementById('meal').value;
    const calories = parseInt(document.getElementById('calories').value, 10);
    const protein = parseInt(document.getElementById('protein').value, 10);
    const carbs = parseInt(document.getElementById('carbs').value, 10);
    const fats = parseInt(document.getElementById('fats').value, 10);

    if (!user_name || !food_name || !meal || isNaN(calories) || isNaN(protein) || isNaN(carbs) || isNaN(fats)) {
      alert("Please fill in all fields correctly.");
      return;
    }

    // Insert payload into database
    const { error } = await db.from('food_logs').insert([
      { user_name, food_name, meal, calories, protein, carbs, fats }
    ]);

    if (error) {
      alert("Error saving to database. Did you run the SQL script? Error: " + error.message);
    } else {
      this.reset();
      btnViewLogs.click(); // Automatically switches to the feed and triggers fetchLogs() so Bob can see what you just added
    }
  });

  // Prevent HTML injections
  function escapeHTML(str) {
    return String(str).replace(/[&<>"']/g, m => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
    })[m]);
  }

  // Event Listeners for Filters
  filterMeal.addEventListener('change', fetchLogs);
  sortBy.addEventListener('change', fetchLogs);
  
  let timeout;
  searchInput.addEventListener('input', () => {
    clearTimeout(timeout);
    timeout = setTimeout(fetchLogs, 300);
  });

  // Initial Load
  fetchLogs();
</script>
</body>
</html>
